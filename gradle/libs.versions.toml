[versions]
picocli = "4.7.7"
fabric8 = "6.10.0"
jackson-bom = "2.21.2"
commonsio = "2.22.0"
junit = "6.1.3"
assertj = "3.26.3"
native-plugin = "1.0.0"
jspecify = "1.0.1"
slf4j = "2.0.19"

[libraries]
picocli = { group = "info.picocli", name = "picocli", version.ref = "picocli" }
picocli-codegen = { group = "info.picocli", name = "picocli-codegen", version.ref = "picocli" }
kubernetes-client = { group = "io.fabric8", name = "kubernetes-client", version.ref = "fabric8" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson-bom" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind" }
jackson-dataformat-yaml = { group = "com.fasterxml.jackson.dataformat", name = "jackson-dataformat-yaml" }
commons-io = { group = "commons-io", name = "commons-io", version.ref = "commonsio" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
assertj-core = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }
jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }
slf4j-bom = { module = "org.slf4j:slf4j-bom", version.ref = "slf4j" }
slfj4-api = { module = "org.slf4j:slf4j-api" }
slfj4-jcl-over-slf4j = { module = "org.slf4j:jcl-over-slf4j" }
slfj4-jdk14 = { module = "org.slf4j:slf4j-jdk14" }
slfj4-jdk-platform-logging = { module = "org.slf4j:slf4j-jdk-platform-logging", version.ref = "slf4j" }
slfj4-ext = { module = "org.slf4j:slf4j-ext", version.ref = "slf4j" }

[bundles]
slf4j-jul = ["slfj4-jdk-platform-logging", "slfj4-api", "slfj4-jdk14", "slfj4-jcl-over-slf4j", "slfj4-ext"]

[plugins]
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "native-plugin" }
